type: collection.insomnia.rest/5.0
name: Loja v5
meta:
  id: wrk_v5loja
  created: 1700000000000
  modified: 1700000000000
collection:
  - name: Produtos
    meta:
      id: fld_v5prod
      sortKey: -10
    headers:
      - name: X-Tenant
        value: "{{ _.tenant }}"
    authentication:
      type: bearer
      token: "{{ _.token }}"
    children:
      - url: "{{ _.base_url }}/produtos"
        name: Listar
        meta:
          id: req_v5listar
          sortKey: -5
        method: GET
        parameters:
          - name: limit
            value: "10"
            disabled: false
      - url: "{{ _.base_url }}/produtos"
        name: Criar
        meta:
          id: req_v5criar
          sortKey: -4
        method: POST
        body:
          mimeType: application/json
          text: '{"nome": "Caneta"}'
        authentication:
          type: basic
          username: ana
          password: "{{ _.senha }}"
        scripts:
          preRequest: console.log(1)
  - url: "{{ _.base_url }}/saude"
    name: Saúde
    meta:
      id: req_v5saude
      sortKey: 1
    method: GET
environments:
  name: Base Environment
  meta:
    id: env_v5base
  data:
    base_url: https://loja.test
    tenant: acme
  subEnvironments:
    - name: Produção
      meta:
        id: env_v5prod
        sortKey: 1
      data:
        base_url: https://prod.loja.test
      color: "#ff0000"
