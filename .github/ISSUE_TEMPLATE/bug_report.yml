name: Relatar bug
description: Algo não funciona como deveria
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Obrigado por relatar! Problemas de segurança vão pelo [relato privado](https://github.com/chmenegatti/zeno/security/advisories/new), não aqui.
  - type: textarea
    id: descricao
    attributes:
      label: O que aconteceu?
      description: Descreva o problema e o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Abra o workspace...
        2. Clique em...
        3. Veja o erro
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão do Zeno
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: instalacao
    attributes:
      label: Como instalou
      options: [".deb", "AppImage", "Código-fonte (npm run dev)", "Outro"]
    validations:
      required: true
  - type: input
    id: so
    attributes:
      label: Sistema operacional
      placeholder: "Ubuntu 24.04, GNOME"
  - type: textarea
    id: logs
    attributes:
      label: Prints, logs ou YAML do request
      description: Remova senhas, tokens e dados internos antes de colar.
      render: shell
