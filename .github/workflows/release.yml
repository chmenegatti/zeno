name: Release

# Roda quando uma tag v* é enviada (criada por `npm run release`). Testa, gera os pacotes da versão Go
# nos três sistemas (workflow Pacotes Go) e publica tudo na mesma release, com as notas do CHANGELOG.

on:
  push:
    tags: ['v*']
  # ensaio: roda tudo (testes, pacotes, notas) e lista o que publicaria, sem criar release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  packages:
    uses: ./.github/workflows/go-packages.yml

  publish:
    needs: [test, packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Notas da versão (seção do CHANGELOG)
        run: |
          v="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || v=$(node -p "require('./package.json').version")
          awk -v v="$v" '/^##+ \[?[0-9]/ { if (p) exit; if (index($0, "[" v "]")) { p = 1; next } } p' CHANGELOG.md > notes.md
          test -s notes.md || echo "Sem notas no CHANGELOG para $v." > notes.md
          cat notes.md

      - name: Arquivos
        run: ls -la dist

      - name: Publicar release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Zeno $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
