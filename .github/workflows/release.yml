name: Release

# Roda quando uma tag v* é enviada (criada por `npm run release`). Testa, gera os pacotes da versão Go
# nos três sistemas (workflow Pacotes Go) e publica tudo na mesma release, com as notas do CHANGELOG.

on:
  push:
    tags: ['v*']
  # ensaio: roda tudo (testes, pacotes, notas) e lista o que publicaria, sem criar release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  packages:
    uses: ./.github/workflows/go-packages.yml

  # Flatpak (fora do Flathub): fontes offline da versão (módulos Go e pacotes npm) e o pacote .flatpak montado
  # do próprio checkout, anexado à release. O runtime vem do Flathub (--runtime-repo): o `flatpak install`
  # baixa sozinho.
  flatpak-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: wails/go.mod
      - name: Gerar go-sources.json e node-sources.json
        run: |
          pip install --user "git+https://github.com/flatpak/flatpak-builder-tools.git#subdirectory=node"
          export PATH="$HOME/.local/bin:$PATH"
          sh packaging/flatpak/update-sources.sh
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-sources
          path: |
            packaging/flatpak/go-sources.json
            packaging/flatpak/go-modules.txt
            packaging/flatpak/node-sources.json

  flatpak:
    needs: flatpak-sources
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: flatpak-sources
          path: packaging/flatpak
      # o manifesto aponta pra uma tag; aqui o app vem do checkout desta versão
      - name: App do checkout
        run: |
          python3 - <<'PY'
          import re
          p = "packaging/flatpak/com.cesarmenegatti.Zeno.yml"
          s = open(p).read()
          s, n = re.subn(r"      - type: git\n        url: https://github.com/chmenegatti/zeno.git\n        tag: .*\n        commit: .*\n",
                         "      - type: dir\n        path: ../..\n        skip: [.git, node_modules, .flatpak-builder, flatpak_app, repo, wails/build, out]\n", s)
          assert n == 1, "fonte git do app não encontrada no manifesto"
          open(p, "w").write(s)
          PY
      # mesmo contorno do workflow Flatpak (overlayfs do Docker, flatpak/flatpak-github-actions#267)
      - name: Runtimes da imagem
        run: |
          cp -a /var/lib/flatpak /var/lib/flatpak-rw
          echo "FLATPAK_SYSTEM_DIR=/var/lib/flatpak-rw" >> "$GITHUB_ENV"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/com.cesarmenegatti.Zeno.yml
          bundle: zeno.flatpak
          cache-key: flatpak-release-${{ hashFiles('packaging/flatpak/*.json') }}
          upload-artifact: false
      - name: Pacote com o runtime do Flathub
        run: |
          v="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || v=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo repo "Zeno-$v-x86_64.flatpak" com.cesarmenegatti.Zeno
          ls -la Zeno-*.flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: Zeno-*.flatpak

  publish:
    needs: [test, packages, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Notas da versão (seção do CHANGELOG)
        run: |
          v="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || v=$(node -p "require('./package.json').version")
          awk -v v="$v" '/^##+ \[?[0-9]/ { if (p) exit; if (index($0, "[" v "]")) { p = 1; next } } p' CHANGELOG.md > notes.md
          test -s notes.md || echo "Sem notas no CHANGELOG para $v." > notes.md
          cat notes.md

      - name: Arquivos
        run: |
          # fontes do flatpak são insumo do build, não vão pra release
          rm -f dist/go-sources.json dist/go-modules.txt dist/node-sources.json
          # o snap vai pra Snap Store (job snap), não pra página da release
          rm -f dist/*.snap
          ls -la dist

      - name: Publicar release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Zeno $GITHUB_REF_NAME" --notes-file notes.md --verify-tag

  # winget: PR de atualização no microsoft/winget-pkgs pelo wingetcreate (ferramenta oficial). Precisa do
  # segredo WINGET_TOKEN (token clássico com escopo public_repo); sem ele, o job só avisa. Os outros
  # gerenciadores se atualizam sozinhos: chmenegatti/homebrew-tap e chmenegatti/scoop-bucket conferem
  # o último release a cada 6 horas.
  winget:
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    continue-on-error: true
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Sem token
        if: env.WINGET_TOKEN == ''
        run: echo "::notice::WINGET_TOKEN não configurado; atualize o winget à mão (packaging/README.md)"
      # o wingetcreate.exe avulso roda sobre o .NET 6, que as imagens Windows do GitHub não trazem mais
      - uses: actions/setup-dotnet@v4
        if: env.WINGET_TOKEN != ''
        with:
          dotnet-version: 6.0.x
      - name: PR no winget-pkgs
        if: env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          $v = "$env:GITHUB_REF_NAME".TrimStart('v')
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update ChMenegatti.Zeno --version $v `
            --urls "https://github.com/chmenegatti/zeno/releases/download/v$v/Zeno-$v-windows-setup.exe" `
            --submit --token $env:WINGET_TOKEN

  # Snap Store (#184): publica no canal stable. Precisa do segredo SNAPCRAFT_STORE_CREDENTIALS
  # (snapcraft export-login --snaps=zeno-rest --acls package_access,package_push,package_release -);
  # sem ele, o job só avisa.
  snap:
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - name: Sem credencial
        if: env.SNAPCRAFT_STORE_CREDENTIALS == ''
        run: echo "::notice::SNAPCRAFT_STORE_CREDENTIALS não configurado; snap não publicado"
      - uses: actions/download-artifact@v8
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        with:
          name: zeno-snap
          path: snap-out
      - id: file
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        run: echo "snap=$(ls snap-out/*.snap | head -1)" >> "$GITHUB_OUTPUT"
      - uses: snapcore/action-publish@v1
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        with:
          snap: ${{ steps.file.outputs.snap }}
          release: stable
