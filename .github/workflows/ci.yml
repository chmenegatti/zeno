name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # versão Go + Wails (migração: #53)
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wails
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: wails/go.mod
          cache-dependency-path: wails/go.sum
      - name: Dependências do sistema (GTK e WebKitGTK)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: npm ci
        working-directory: .
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: make test
      - run: make vet
      - run: make build
      - run: make cli
