name: Pacotes Go

# Pacotes da versão Go nos três sistemas: .deb, .rpm e AppImage (Linux), instalador e .zip (Windows),
# .dmg universal (macOS) e a CLI de cada um. Em PR/push ficam como artefatos; o release.yml chama este
# workflow na tag e publica tudo.

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['wails/**', 'src/renderer/**', 'src/shared/**', 'packaging/flatpak/*.metainfo.xml', '.github/workflows/go-packages.yml']
  # todo PR que mexe na versão Go: código específico de Windows/macOS só compila e testa nesses jobs
  pull_request:
    paths: ['wails/**', 'packaging/flatpak/*.metainfo.xml', '.github/workflows/go-packages.yml']

permissions:
  contents: read

concurrency:
  group: go-packages-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: wails
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: wails/go.mod
          cache-dependency-path: wails/go.sum
      - name: Dependências do sistema (GTK e WebKitGTK)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev rpm
      - run: npm ci
        working-directory: .
      - name: appimagetool
        run: |
          curl -sSL -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          sudo apt-get install -y libfuse2t64
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
      - run: make deb
      - run: make rpm
      - run: make appimage
      - name: CLI
        run: |
          make cli
          tar -C build -czf "build/Zeno-$(node -p "require('../package.json').version")-linux-cli.tar.gz" zeno-cli
      - name: Conferir o .deb
        run: |
          dpkg-deb -I build/*.deb
          dpkg-deb -c build/*.deb
      - uses: actions/upload-artifact@v7
        with:
          name: zeno-linux
          path: |
            wails/build/*.deb
            wails/build/*.rpm
            wails/build/*.AppImage
            wails/build/*-linux-cli.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: wails
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: wails/go.mod
          cache-dependency-path: wails/go.sum
      - run: npm ci
        working-directory: .
      - name: Testes Go no Windows
        run: go test ./internal/...
      - name: Interface e ícone
        run: |
          (cd .. && npx vite build)
          rm -rf frontend/dist && mkdir -p frontend build && cp -r ../out/renderer frontend/dist
          cp ../build/icons/512x512.png frontend/icon.png
          cp ../build/icons/512x512.png build/appicon.png
          # versão do instalador = package.json
          node -e "const f='wails.json',w=require('./'+f);w.info.productVersion=require('../package.json').version;require('fs').writeFileSync(f,JSON.stringify(w,null,2))"
      - name: Wails CLI e NSIS
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
          command -v makensis || choco install nsis -y --no-progress
          echo "C:/Program Files (x86)/NSIS" >> "$GITHUB_PATH"
      - name: Instalador (NSIS) e executável
        run: wails build -platform windows/amd64 -nsis -s -skipbindings -trimpath -ldflags "-s -w"
      - name: CLI
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o build/bin/zeno-cli.exe ./cmd/zeno-cli
      - name: Versão portátil (.zip)
        run: |
          v=$(node -p "require('../package.json').version")
          cd build/bin && 7z a "../Zeno-$v-windows-portable.zip" zeno.exe zeno-cli.exe
          mv Zeno-amd64-installer.exe "../Zeno-$v-windows-setup.exe"
          ls -la .. .
      - uses: actions/upload-artifact@v7
        with:
          name: zeno-windows
          path: |
            wails/build/*-windows-setup.exe
            wails/build/*-windows-portable.zip
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: wails
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: wails/go.mod
          cache-dependency-path: wails/go.sum
      - run: npm ci
        working-directory: .
      - name: Testes Go no macOS (com o Keychain)
        run: |
          go test ./internal/...
          go test -v -count=1 -run TestKeychain ./internal/keyring/ | tee keychain.log
          grep -q -- '--- PASS: TestKeychain' keychain.log
        env:
          ZENO_KEYCHAIN_TEST: '1'
      - name: Interface e ícone
        run: |
          (cd .. && npx vite build)
          rm -rf frontend/dist && mkdir -p frontend build && cp -r ../out/renderer frontend/dist
          cp ../build/icons/512x512.png frontend/icon.png
          cp ../build/icons/512x512.png build/appicon.png
          node -e "const f='wails.json',w=require('./'+f);w.info.productVersion=require('../package.json').version;require('fs').writeFileSync(f,JSON.stringify(w,null,2))"
      - name: Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - name: App universal (Intel + Apple Silicon)
        run: |
          wails build -platform darwin/universal -s -skipbindings -trimpath -ldflags "-s -w"
          lipo -info build/bin/Zeno.app/Contents/MacOS/zeno
      - name: CLI universal
        run: |
          for a in arm64 amd64; do CGO_ENABLED=1 GOARCH=$a go build -trimpath -ldflags "-s -w" -o build/zeno-cli-$a ./cmd/zeno-cli; done
          lipo -create -output build/bin/zeno-cli build/zeno-cli-arm64 build/zeno-cli-amd64
      - name: Assinatura ad-hoc e .dmg
        run: |
          v=$(node -p "require('../package.json').version")
          codesign --force --deep --sign - build/bin/Zeno.app
          codesign --verify --deep --strict build/bin/Zeno.app
          mkdir -p dmg && cp -R build/bin/Zeno.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Zeno -srcfolder dmg -ov -format UDZO "build/Zeno-$v-macos-universal.dmg"
          (cd build/bin && zip -q "../Zeno-$v-macos-cli.zip" zeno-cli)
          ls -la build
      - uses: actions/upload-artifact@v7
        with:
          name: zeno-macos
          path: |
            wails/build/*-macos-universal.dmg
            wails/build/*-macos-cli.zip
          if-no-files-found: error
