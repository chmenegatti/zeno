openapi: 3.0.3
info:
  title: Loja
  version: 1.2.0
  description: API de exemplo
servers:
  - url: https://{ambiente}.loja.test/v1
    description: Produção
    variables:
      ambiente: { default: api }
  - url: http://localhost:8080/v1
    description: Local
tags:
  - name: produtos
    description: Catálogo
  - name: pedidos
security:
  - bearer: []
paths:
  /produtos:
    get:
      tags: [produtos]
      summary: Listar produtos
      parameters:
        - { name: limit, in: query, required: true, schema: { type: integer, default: 20 } }
        - { name: X-Tenant, in: header, schema: { type: string, example: acme } }
      responses: { '200': { description: ok } }
    post:
      tags: [produtos]
      summary: Criar produto
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Produto' }
      responses: { '201': { description: criado } }
  /produtos/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, example: p-1 } }
    get:
      tags: [produtos]
      operationId: obterProduto
      security: [{ chave: [] }]
      responses: { '200': { description: ok } }
    delete:
      tags: [produtos]
      summary: Apagar produto
      deprecated: true
      security: []
      responses: { '204': { description: ok } }
  /produtos/{id}/foto:
    put:
      tags: [produtos]
      summary: Enviar foto
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                legenda: { type: string, example: Frente }
                arquivo: { type: string, format: binary }
      responses: { '200': { description: ok } }
  /pedidos:
    post:
      tags: [pedidos]
      summary: Criar pedido
      requestBody:
        content:
          application/json:
            examples:
              simples: { value: { produto: p-1, quantidade: 2 } }
      responses: { '201': { description: ok } }
  /saude:
    get:
      summary: Saúde
      security: []
      parameters:
        - { name: sessao, in: cookie, schema: { type: string } }
      responses: { '200': { description: ok } }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
    chave: { type: apiKey, in: header, name: X-API-Key }
  schemas:
    Produto:
      type: object
      properties:
        id: { type: string, readOnly: true }
        nome: { type: string, example: Caneta }
        preco: { type: number, example: 3.5 }
        tags: { type: array, items: { type: string } }
        categoria: { $ref: '#/components/schemas/Categoria' }
    Categoria:
      type: object
      properties:
        nome: { type: string, enum: [escritorio, casa] }
        pai: { $ref: '#/components/schemas/Categoria' }
